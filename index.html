<style>
  /* Layout: one screen holding a small book. The wrapped gift sits on top of it; once the gift opens,
     the name card is the book's first page and every card after it is turned like a real page. */
  :root {
    --ink: #15112b;
    --ink-2: #221a45;
    --fg: #f3f0fb;
    --muted: #b4abd3;
    --gold: #f3b95f;
    --on-gold: #2a1a05;
    --focus: #e4ff90;
    --line: #342a63;
    --shadow: rgba(6, 3, 22, 0.55);
    --font-display: "DynaPuff", "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --radius: 14px;
    color-scheme: dark;
  }
  html { height: 100%; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    height: 100%; margin: 0; overflow: hidden;
    background: radial-gradient(120% 60% at 50% 0%, #2c1d57 0%, transparent 70%) no-repeat, var(--ink);
    color: var(--fg); font-family: var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 14px 12px;
    -webkit-tap-highlight-color: transparent;
  }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  .app { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 12px; max-width: 520px; margin-inline: auto; }

  .stage { min-height: 0; display: grid; place-items: center; container-type: size; }
  .frame {
    position: relative; width: min(100%, 56vh); width: min(100cqw, calc(100cqh * 9 / 16)); aspect-ratio: 9 / 16;
    filter: drop-shadow(0 18px 30px var(--shadow));
  }

  /* the gift */
  .gift {
    position: absolute; inset: 0; z-index: 3; display: block; padding: 0; border: 0; overflow: hidden;
    border-radius: var(--radius); background: var(--ink-2); cursor: pointer; transition: opacity 0.5s ease;
  }
  .gift video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .gift::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 3px var(--gold); opacity: 0; }
  .gift.closed::after { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: 0.6; } }
  .gift.gone { opacity: 0; pointer-events: none; }
  .gift:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
  .tap {
    position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%);
    padding: 11px 20px; border-radius: 999px; background: var(--gold); color: var(--on-gold);
    font: 600 15px/1.2 var(--font-body); white-space: nowrap; box-shadow: 0 8px 20px var(--shadow);
  }

  /* the book */
  .book { position: absolute; inset: 0; z-index: 1; touch-action: none; -webkit-user-select: none; user-select: none; }
  .page { background: var(--ink-2); overflow: hidden; }
  .page img { display: block; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  .page.keep { background: #221a45; color: var(--fg); }
  .keep-in { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 9% 8%; }
  .keep .eyebrow { margin: 0; font: 600 12px/1.4 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .keep h2 { margin: 0; font: 600 30px/1.1 var(--font-display); }
  .keep p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--muted); }
  .keep .save {
    align-self: flex-start; display: inline-block; padding: 13px 22px; border-radius: 999px; background: var(--gold); color: var(--on-gold);
    font: 600 16px/1 var(--font-body); text-decoration: none;
  }
  .keep .from { margin-top: 18px; font: 600 12px/1.4 var(--font-body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }

  /* arrows and page counter */
  .nav { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .nav button {
    width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%;
    border: 1px solid var(--line); background: var(--ink-2); color: var(--fg); cursor: pointer;
  }
  .nav button:disabled { opacity: 0.35; cursor: default; }
  .nav button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .nav svg { width: 20px; height: 20px; }
  .nav .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(243, 185, 95, 0.28); border-color: var(--gold); } }
  .count { min-width: 9.5em; text-align: center; font: 500 14px/1.2 var(--font-body); color: var(--muted); font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: reduce) {
    .gift.closed::after, .nav .pulse { animation: none; }
    .gift { transition: none; }
  }
</style>
</head>
<body>
<main class="app" aria-label="Your session notes">
  <div class="stage">
    <div class="frame" id="frame">
      <div class="book" id="book" aria-live="polite"></div>
      <button class="gift closed" id="gift" type="button" aria-label="Open your gift">
        <video id="giftVideo" muted playsinline preload="auto" poster="poster.jpg" width="1080" height="1920" aria-hidden="true">
          <source src="gift.mp4" type="video/mp4">
        </video>
        <span class="tap" id="tapPill">Tap the gift to open it</span>
      </button>
    </div>
  </div>
  <nav class="nav" aria-label="Pages">
    <button id="prev" type="button" aria-label="Previous page" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <span class="count" id="count">Tap the gift</span>
    <button id="next" type="button" aria-label="Next page" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  </nav>
</main>

<!-- the book's pages, handed to the page-turn library -->
<div id="pages" hidden>
  <div class="page"><img src="01-cover.jpg" alt="For Sam: The City That Started Christmas Early. Session 3, from PTE CENTER."></div>
  <div class="page"><img src="02-numbers.jpg" alt="You did the talking: your speaking time, words and longest answer."></div>
  <div class="page"><img src="03-well.jpg" alt="What you do well."></div>
  <div class="page"><img src="04-tutor.jpg" alt="A note from your tutor."></div>
  <div class="page"><img src="05-fixed.jpg" alt="What you fixed since last time."></div>
  <div class="page"><img src="06-level.jpg" alt="Your speaking level this session."></div>
  <div class="page"><img src="07-levelx.jpg" alt="What your level means, part 1 of 2."></div>
  <div class="page"><img src="08-levelx-2.jpg" alt="What your level means, part 2 of 2."></div>
  <div class="page"><img src="09-parts.jpg" alt="Your minutes, part by part."></div>
  <div class="page"><img src="10-fixes.jpg" alt="Every correction, part 1 of 2."></div>
  <div class="page"><img src="11-fixes-2.jpg" alt="Every correction, part 2 of 2."></div>
  <div class="page"><img src="12-local.jpg" alt="Say it like a local."></div>
  <div class="page"><img src="13-auslines.jpg" alt="Your sentences, the Aussie way."></div>
  <div class="page"><img src="14-words.jpg" alt="The three expressions we covered."></div>
  <div class="page"><img src="15-next.jpg" alt="What happens next. See you next time!"></div>
  <div class="page keep"><div class="keep-in">
    <p class="eyebrow">Session 3 · The City That Started Christmas Early</p>
    <h2>Keep your notes</h2>
    <p>The same cards in one PDF file, to keep on your phone and look back on before your next session.</p>
    <a class="save" href="notes.pdf" download="PTE-CENTER-Session-03-Notes.pdf">Save the PDF</a>
    <p class="from">From PTE CENTER</p>
    </div></div>
</div>

<script src="page-flip.browser.js"></script>
<script>
(() => {
  const frame = document.getElementById('frame');
  const bookEl = document.getElementById('book');
  const count = document.getElementById('count');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  const source = [...document.querySelectorAll('#pages .page')];
  const n = source.length;
  let book = null, at = 0, opened = false, turned = false;

  function paint() {
    if (!opened) return;
    prev.disabled = at === 0;
    next.disabled = at >= n - 1;
    const hint = !turned && at === 0;
    count.textContent = hint ? 'Turn the page' : (at + 1) + ' / ' + n;
    next.classList.toggle('pulse', hint);
  }

  // The book is sized to the frame; it is rebuilt if the screen size changes (a phone turned sideways).
  function build(startAt) {
    const r = frame.getBoundingClientRect();
    const w = Math.round(r.width), h = Math.round(r.height);
    if (book) { try { book.destroy(); } catch (e) {} bookEl.replaceChildren(); }
    const holder = document.createElement('div');
    bookEl.appendChild(holder);
    book = new St.PageFlip(holder, {
      width: w, height: h, size: 'fixed', usePortrait: true, autoSize: true, showCover: false,
      drawShadow: true, maxShadowOpacity: 0.55, flippingTime: reduce.matches ? 250 : 850,
      startPage: startAt || 0, swipeDistance: 20, showPageCorners: true, mobileScrollSupport: true,
    });
    book.on('flip', (e) => { at = e.data; if (at > 0) turned = true; paint(); });
    book.loadFromHTML(source.map((p) => p.cloneNode(true)));
  }
  build(0);
  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => build(at), 200);
  });

  prev.addEventListener('click', () => book && book.flipPrev('bottom'));
  next.addEventListener('click', () => book && book.flipNext('bottom'));
  document.addEventListener('keydown', (e) => {
    if (!opened || !book) return;
    if (e.key === 'ArrowRight') { book.flipNext('bottom'); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { book.flipPrev('bottom'); e.preventDefault(); }
  });

  // The gift: tap, the film plays, then it fades into the book's first page (the same name card).
  const gift = document.getElementById('gift');
  const vid = document.getElementById('giftVideo');
  const tap = document.getElementById('tapPill');
  let state = 'closed', timer = 0;
  function settle() {
    if (state === 'open') return;
    clearTimeout(timer);
    state = 'open'; opened = true;
    gift.classList.remove('closed');
    gift.classList.add('gone');
    setTimeout(() => { gift.hidden = true; }, 600);
    paint();
  }
  gift.addEventListener('click', () => {
    if (state !== 'closed') return;
    tap.hidden = true;
    if (reduce.matches) { settle(); return; }
    state = 'playing';
    gift.classList.remove('closed');
    const p = vid.play();
    if (p && typeof p.catch === 'function') p.catch(settle);
    timer = setTimeout(settle, 9000);
  });
  vid.addEventListener('ended', settle);
  vid.addEventListener('error', () => { if (state === 'playing') settle(); }, true);
})();
</script>
</body>
